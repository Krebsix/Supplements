<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1284" height="1284" viewBox="0 0 1284 1284">
  <!--
    Startbildschirm.

    Der Verlauf ist hier radial statt linear: Er laeuft an ALLEN vier Raendern
    in dieselbe Farbe (#011a39) aus, und genau die steht als backgroundColor
    in app.json. Bei resizeMode "contain" bleibt links und rechts (oder oben
    und unten) die backgroundColor stehen — mit einem linearen Verlauf gaebe
    das eine sichtbare Kante, weil oben und unten unterschiedliche Farben
    haetten.

    Das Motiv ist kleiner als im Icon: Ein Startbildschirm zeigt eine Marke,
    kein formatfuellendes Bild.
  -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0"    stop-color="#06264f"/>
      <stop offset="0.55" stop-color="#02203f"/>
      <stop offset="1"    stop-color="#011a39"/>
    </radialGradient>

    <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#000"/>
      <stop offset="0.05" stop-color="#fff"/>
      <stop offset="0.95" stop-color="#fff"/>
      <stop offset="1"    stop-color="#000"/>
    </linearGradient>
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#000"/>
      <stop offset="0.04" stop-color="#fff"/>
      <stop offset="0.96" stop-color="#fff"/>
      <stop offset="1"    stop-color="#000"/>
    </linearGradient>
    <mask id="feather">
      <rect x="385" y="419" width="514" height="447" fill="url(#fadeY)"/>
      <rect x="385" y="419" width="514" height="447" fill="url(#fadeX)"
            style="mix-blend-mode:multiply"/>
    </mask>
  </defs>

  <rect width="1284" height="1284" fill="url(#bg)"/>

  <g mask="url(#feather)">
    <g transform="translate(240.4, 296.65) scale(0.6425)">
      <image x="0" y="0" width="1254" height="1254" xlink:href="motiv-original.png"/>
    </g>
  </g>
</svg>
